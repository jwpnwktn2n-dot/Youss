name: Refresh Casablanca market and news
on:
  schedule:
    - cron: '17 5,11,17,23 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Fetch public market and news sources
        run: python scripts/update_market.py
      - name: Commit refreshed snapshots if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market.json data/news.json
          git diff --cached --quiet || (git commit -m 'Refresh Casablanca data' && git push)
