name: Update and publish MyMoney Casa

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5,11,17,23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mymoney-casa-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install updater dependencies
        run: pip install -r scripts/requirements.txt
      - name: Refresh public Casablanca prices and news
        run: python scripts/update_market.py
      - name: Validate JavaScript before publishing
        run: |
          node --check kdp.js
          node --check enhancements.js
          node --check ar-dict.js
          node --check i18n.js
      - name: Prepare public website files
        run: |
          mkdir -p _site/data
          cp index.html manifest.webmanifest icon.svg sw.js kdp.js enhancements.js ar-dict.js i18n.js .nojekyll _site/
          cp data/market.json data/news.json _site/data/
          test -s _site/index.html
          python -m json.tool _site/data/market.json > /dev/null
          python -m json.tool _site/data/news.json > /dev/null
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy MyMoney Casa
        id: deployment
        uses: actions/deploy-pages@v4
