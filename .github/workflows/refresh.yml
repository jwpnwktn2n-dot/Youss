name: Update and publish MyMoney Casa

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 1,5,9,13,17,21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mymoney-casa-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install updater dependencies
        run: pip install -r scripts/requirements.txt
      - name: Refresh public Casablanca prices and news
        run: python scripts/update_market.py
      - name: Generate evidence-based investment research
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-6-luna
        run: python scripts/research_desk.py
      - name: Validate risk scoring rules
        run: python tests/risk-engine.py
      - name: Validate generated market research
        run: |
          python -m py_compile scripts/research_desk.py
          python -m json.tool data/research.json > /dev/null
          python - <<'PY'
          import json
          r=json.load(open('data/research.json'))
          assert r['stocks'], 'No screened companies'
          assert all('riskFacts' in s and 'score' in s for s in r['stocks'])
          assert not r['llmActivated'] or isinstance(r['aiCommentary'],dict)
          print('Validated',len(r['stocks']),'company assessments; mode',r['mode'])
          PY
      - name: Validate JavaScript before publishing
        run: |
          node --check kdp.js
          node --check enhancements.js
          node --check ar-dict.js
          node --check i18n.js
          node --check login.js
          node --check research.js
      - name: Validate inline app code
        run: |
          python - <<'PY'
          import pathlib, re
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          match=re.search(r'<script>(.*?)</script>',html,re.S)
          assert match, 'inline app logic missing'
          pathlib.Path('/tmp/mymoney-inline.js').write_text(match.group(1),encoding='utf-8')
          PY
          node --check /tmp/mymoney-inline.js
      - name: Test budget interactions
        run: |
          npm install --no-save --ignore-scripts jsdom@26
          node tests/budget-ui.cjs
          node tests/research-colors.cjs
      - name: Prepare public website files
        run: |
          mkdir -p _site/data
          cp index.html manifest.webmanifest icon.svg sw.js kdp.js enhancements.js ar-dict.js i18n.js login.js research.js .nojekyll _site/
          cp data/market.json data/news.json data/research.json _site/data/
          test -s _site/index.html
          python -m json.tool _site/data/market.json > /dev/null
          python -m json.tool _site/data/news.json > /dev/null
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy MyMoney Casa
        id: deployment
        uses: actions/deploy-pages@v4
